name : CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
job:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.15
      - name: Verification syntaxe Python
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m unittest -v